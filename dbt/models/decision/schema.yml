version: 2

models:
  - name: decision_signals
    description: >
      Unified KBS decision layer — single output table per (symbol, date).

      Reads all six gold models directly and applies the decision_table seed
      (§4.7 Formal Logic) to produce BUY / SELL / HOLD signals with a formal
      certainty factor (§4.10 Certainty Factors) on a −1.0 to +1.0 scale.

      Knowledge representation:
        §4.1  Production rules  — each row of decision_table.csv is an IF-THEN rule
        §4.7  Decision tree     — signal_score → rating (5-branch CASE)
        §4.7  Decision table    — dbt/seeds/decision_table.csv (the explicit KB)
        §4.10 Certainty Factors — signal_cf column (−1.0 to +1.0) on every row

      Explanation facility (§4.8–4.9):
        why_signal      — Why this specific signal was produced (Dynamic)
        why_not_buy     — Which condition blocked BUY, in priority order (Tracing)
        why_not_sell    — Why SELL was not triggered (Tracing)
        reasoning_trace — Numbered step-by-step How trace

      Knowledge Acquisition interface (§6.9, §7.4):
        Edit dbt/seeds/decision_table.csv → run dbt seed → run dbt run
        No SQL knowledge required from the domain expert.
    columns:
      - name: symbol
        tests: [not_null]
      - name: date
        tests: [not_null]
      - name: close
        tests: [not_null]
      - name: signal
        description: "Actionable output: BUY, SELL, or HOLD."
        tests:
          - not_null
          - accepted_values:
              values: ["BUY", "SELL", "HOLD"]
      - name: signal_cf
        description: >
          Certainty factor (§4.10) from the matched decision table row.
          Scale: −1.0 (maximum SELL conviction) to +1.0 (maximum BUY conviction).
          Near zero = uncertain / HOLD tendency.
        tests: [not_null]
      - name: confidence
        description: "Conviction tier derived from |signal_cf|: HIGH (≥0.65) / MEDIUM (≥0.40) / LOW (<0.40)."
        tests:
          - not_null
          - accepted_values:
              values: ["HIGH", "MEDIUM", "LOW"]
      - name: state_id
        description: "Matched row in decision_table.csv (e.g. S05). NULL only on anomaly SELL override."
      - name: rating
        description: "Decision tree output: Strong Buy / Buy / Neutral / Sell / Strong Sell."
        tests:
          - not_null
          - accepted_values:
              values: ["Strong Buy", "Buy", "Neutral", "Sell", "Strong Sell"]
      - name: why_signal
        description: "Why this signal was produced — Dynamic explanation (§4.8)."
        tests: [not_null]
      - name: why_not_buy
        description: "Which condition blocked BUY, in priority order. NULL when signal = BUY."
      - name: why_not_sell
        description: "Why SELL was not triggered. NULL when signal = SELL."
      - name: reasoning_trace
        description: "Numbered step-by-step inference trace — How/Tracing explanation (§4.9)."
        tests: [not_null]
      - name: vol_level
        description: "Volatility category used for decision table lookup: low / normal / high / extreme."
        tests:
          - not_null
          - accepted_values:
              values: ["low", "normal", "high", "extreme"]
      - name: at_52w_pos
        description: "52-week position category: near_low / neutral / near_high."
        tests:
          - not_null
          - accepted_values:
              values: ["near_low", "neutral", "near_high"]
      - name: sector_ok
        description: "TRUE when sector advance ratio ≥ 50%."
        tests: [not_null]

  - name: decision_case_outcomes
    description: >
      CBR case library — Retain step (Lecture 7 §7.8–7.10).
      Schema shell; rows written by the Airflow DAG decision_cbr_outcomes.
      Stores resolved WIN/LOSS outcomes for future CBR lookup.
    columns:
      - name: symbol
        tests: [not_null]
      - name: signal_date
        tests: [not_null]
      - name: signal
        tests:
          - accepted_values:
              values: ["BUY", "SELL", "HOLD"]
      - name: outcome
        description: "WIN or LOSS based on 5-day forward return vs signal direction."
        tests:
          - accepted_values:
              values: ["WIN", "LOSS"]
      - name: signal_cf
        description: "Certainty factor from decision_signals at the time of the signal (−1.0 to +1.0)."
      - name: return_5d
        description: "5-day forward return: (close_t+5 − close_t) / close_t."
      - name: return_20d
        description: "20-day forward return: (close_t+20 − close_t) / close_t."

  - name: decision_validation
    description: >
      Signal accuracy and reliability metrics per month, signal type, and sector.
      Implements §4.11–4.12 — Evaluation, Validation, and Verification.
      Populated once decision_case_outcomes has data from the CBR DAG.
    columns:
      - name: month
        tests: [not_null]
      - name: signal
        tests:
          - not_null
          - accepted_values:
              values: ["BUY", "SELL", "HOLD"]
      - name: sector
        tests: [not_null]
      - name: accuracy
        description: "Fraction of signals with outcome = WIN (§4.12 Accuracy)."
      - name: reliability
        description: "Fraction of predictions empirically correct (§4.12 Reliability)."
      - name: threshold_sensitive_count
        description: "Signals near the CF boundary (|signal_cf| 0.35–0.45) — §4.12 Sensitivity."
